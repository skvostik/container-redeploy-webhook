name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # run by release.yml before publishing

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Same toolchain as the Dockerfile (latest 1.27 patch release);
          # go.mod only states the minimum version.
          go-version: "1.27.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t container-redeploy-webhook:dev .
      - run: scripts/e2e.sh
        env:
          DOCKER_SOCK: /var/run/docker.sock
