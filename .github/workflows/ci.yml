name: CI

on:
  pull_request:
  # Pushes to main and release tags run CI through release.yml, before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Same toolchain as the Dockerfile (latest 1.27 patch release);
          # go.mod only states the minimum version.
          go-version: "1.27.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t container-redeploy-webhook:dev .
      - run: scripts/e2e.sh
        env:
          DOCKER_SOCK: /var/run/docker.sock

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t container-redeploy-webhook:scan .
      # Scans the image that ships: the Go binary's modules and stdlib.
      # Pinned by commit: trivy-action release tags were hijacked in 2026.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: container-redeploy-webhook:scan
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
